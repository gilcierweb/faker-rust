[package]
name = "faker-rust"
version = "0.1.0"
edition = "2024"
authors = ["GilcierWeb"]
description = "A high-performance, locale-aware fake data generator for Rust"
license = "MIT"
repository = "https://github.com/gilcierweb/faker-rust"
documentation = "https://docs.rs/faker-rust"
readme = "README.md"
keywords = ["faker", "fake", "data", "generator", "testing"]
categories = ["development-tools::testing", "text-processing"]
rust-version = "1.89" # raised from 1.85: rust-i18n 4 -> rust-i18n-macro -> serde-saphyr (MSRV 1.89)

[package.metadata.i18n]
available-locales = ["en"]
default-locale = "en"
load-path = "locales"

[dependencies]
rand = "0.8"
once_cell = "1.19"
rust-i18n = "4.2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "1.2"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "faker-rust"
path = "src/bin/faker_rust.rs"

[dev-dependencies]